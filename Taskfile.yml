version: '3'

tasks:
  default:
    desc: Compile a project from ./projects, prompting when multiple inputs exist
    cmds:
      - task: compile

  compile:
    desc: Compile a TeX project from a zip file or directory
    vars:
      INPUT: '{{default "" .INPUT}}'
      TARGET: '{{default "" .TARGET}}'
    cmds:
      - ./scripts/compile_project.sh '{{.INPUT}}' '{{.TARGET}}'

  inputs:
    desc: List candidate projects in ./projects
    cmds:
      - ./scripts/list_inputs.sh

  iros2026:
    desc: Compile IROS2026 in RAS conference format
    cmds:
      - task: compile
        vars:
          INPUT: projects/IROS2026
          TARGET: root.tex

  iros2026-ral:
    desc: Compile IROS2026 in RA-L final journal format
    cmds:
      - task: compile
        vars:
          INPUT: projects/IROS2026
          TARGET: root_ral.tex

  ecdwpp:
    desc: Compile EC-DWPP paper in RA-L journal format (Japanese draft, lualatex)
    cmds:
      - task: compile
        vars:
          INPUT: projects/RAL2026_ECDWPP
          TARGET: root.tex

  ecdwpp-proofs:
    desc: Compile EC-DWPP full-proof standalone document
    cmds:
      - task: compile
        vars:
          INPUT: projects/RAL2026_ECDWPP
          TARGET: theory/proofs_full.tex

  dwpp-ras:
    desc: Compile DWPP RAS revision manuscript
    cmds:
      - task: compile
        vars:
          INPUT: projects/DWPP_RAS
          TARGET: manuscript/elsarticle-template-num.tex

  nadwpp:
    desc: Compile NA-DWPP paper in RA-L journal format (Japanese draft, lualatex)
    cmds:
      - task: compile
        vars:
          INPUT: projects/RAL2026_NADWPP
          TARGET: root.tex

  nadwpp-derivations:
    desc: Compile NA-DWPP full-derivation standalone document
    cmds:
      - task: compile
        vars:
          INPUT: projects/RAL2026_NADWPP
          TARGET: theory/derivations_full.tex

  clean:
    desc: Remove extracted workspaces and compiled outputs
    cmds:
      - rm -rf .work output
      - mkdir -p output
      - touch output/.gitkeep
